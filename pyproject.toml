[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-connector"
version = "0.1.0"
description = "Non-invasive industrial data capture using computer vision"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Good AI", email = "contact@wearegoodai.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
keywords = [
    "industrial",
    "computer-vision",
    "ocr",
    "hmi",
    "scada",
    "gauge-reading",
    "non-invasive",
    "data-capture",
    "manufacturing",
]

dependencies = [
    "opencv-python-headless>=4.5.0",
    "pytesseract>=0.3.10",
    "numpy>=1.20.0",
    "Pillow>=9.0.0",
    "paho-mqtt>=1.6.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
]
gui = [
    "opencv-python>=4.5.0",
]
metrics = [
    "prometheus-client>=0.17.0",
]
config = [
    "pyyaml>=6.0",
]
all = [
    "prometheus-client>=0.17.0",
    "opencv-python>=4.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/GoodAI-Global/vision-connector"
Documentation = "https://github.com/GoodAI-Global/vision-connector#readme"
Repository = "https://github.com/GoodAI-Global/vision-connector"
Issues = "https://github.com/GoodAI-Global/vision-connector/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4"]
ignore = [
    "E501",   # Line length handled by black
    "N818",   # Exception name doesn't need Error suffix (CircuitBreakerOpen is clear)
]

[tool.ruff.lint.isort]
known-first-party = ["vision_connector"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
